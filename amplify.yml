# Amplify Hosting build for the Next.js static export in /web.
# The app root comes from AMPLIFY_MONOREPO_APP_ROOT=web (set in infra/lib/WebStack.ts),
# and NEXT_PUBLIC_* values are Amplify environment variables set there too.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 20 && nvm use 20
            # npm workspaces: install everything from the repo root lockfile. The web app imports
            # types from services/shared, which need that workspace's deps (e.g. zod) to resolve.
            - (cd .. && npm ci --no-audit --no-fund)
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
